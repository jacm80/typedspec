# The contract the act node writes and the review node checks, before any code.
# Stored as a schema-validated record; an invalid one is refused, not stored.
task: orders-require-session/1.1
goal: POST /orders refuses a request without a session
requirements: [no-session-is-refused]          # scenario ids, never free prose
acceptance:
  - a request without a session gets 401
  - nothing is written to the orders table on refusal
files:                                          # the implement node may touch only these
  - apps/api/src/modules/orders/orders.controller.ts
  - apps/api/test/orders.e2e-spec.ts
forbidden:
  - changing the session guard shared by other modules
  - skipping or deleting existing tests
revert_check: >
  with the guard removed, orders.e2e-spec.ts#no-session-is-refused fails
receipts:                                       # re-run by the checker, never trusted from the worker
  - pnpm --filter api test:e2e -- -t no-session-is-refused
  - pnpm verify
risk:
  level: high                                   # fixed path rule: orders, payments, auth, tenant data, migrations
  reasons: [touches apps/api/src/modules/orders/]
